<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Planner | Unified View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light">

    <div id="task_planner_success_message" class="alert alert-success shadow">
        <i class="bi bi-check-circle-fill"></i> Task added!
    </div>

    <header class="fixed-top bg-white border-bottom">
        <div class="container py-3">
            <span class="fs-4 fw-bold text-success"><i class="bi bi-list-check"></i> Task Planner</span>
        </div>
    </header>

    <main class="container mt-5 pt-5">

        <!-- Create Task Form -->
        <section class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Create Task</h5>
                <small class="d-none d-md-block">Enter to Save | Esc to Clear | Shift to Refresh</small>
            </div>
            <div class="card-body">
                <form id="input-form" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Category</label>
                        <select id="task-category" class="form-select">
                            <option value="General">General</option>
                            <option value="Work">Work</option>
                            <option value="School">School</option>
                            <option value="Shopping">Shopping</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Title *</label>
                        <input type="text" id="task-title" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Priority</label>
                        <select id="task-priority" class="form-select">
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold">Description</label>
                        <textarea id="task-description" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-primary px-4">Add Task</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- Filter Controls -->
        <section class="row g-2 mb-3">
            <div class="col-md-5">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" id="filter-search" class="form-control"
                        placeholder="Search tasks by name...">
                </div>
            </div>
            <div class="col-md-3">
                <select id="filter-priority" class="form-select">
                    <option value="all">All Priorities</option>
                    <option value="high">High only</option>
                    <option value="high and medium">High and Medium</option>
                </select>
            </div>
            <div class="col-md-4">
                <select id="filter-category" class="form-select">
                    <option value="all">All Categories</option>
                    <option value="general">General</option>
                    <option value="work">Work</option>
                    <option value="school">School</option>
                    <option value="shopping">Shopping</option>
                </select>
            </div>
        </section>

        <!-- Task Body -->
        <section class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="text-center">Done</th>
                            <th>Priority</th>
                            <th class="text-center">Category</th>
                            <th>Title</th>
                            <th>Description</th>
                            <th class="text-center">Delete</th>
                        </tr>
                    </thead>
                    <tbody id="task-results-window">


                        <!-- Task Results Go Here -->
                        <tr data-id="task0">
                            <td><input type="checkbox" class="form-check-input" data-id="task0"></td>
                            <td>1</td>
                            <td><span class="badge bg-secondary">Work</span></td>
                            <td class="fw-bold">Update Styling</td>
                            <td class="text-muted small">Integrate client-requested filters</td>
                            <td class="text-end">
                                <button class="btn btn-link text-danger p-0" data-id="task0"><i
                                        class="bi bi-x-circle-fill"></i></button>
                            </td>
                        </tr>


                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="py-4 mt-5 bg-white border-top text-center text-muted">
        <p>© 2026 Dan Wenger | Task Planner Project</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
